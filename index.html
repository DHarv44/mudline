<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MUDLINE</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { position: fixed; left: 0; top: 0; display: block; width: 100vw; height: 100vh; }
      /* The track is drawn on the graphics card underneath; vehicles, effects and menus are drawn on top. */
      #gl { z-index: 0; }
      #game { z-index: 1; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
